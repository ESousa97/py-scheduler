# Exemplo de configuração de jobs para o py-scheduler.
# Cada job referencia um nome registrado em código (JobRegistry).
# Retry usa Exponential Backoff e, se omitido, tenta 3 vezes.
#
# Webhook opcional: após esgotar retentativas, envia POST JSON com
# job_name, error, timestamp. Com notify_on_success: true, envia também
# após cada execução bem-sucedida (útil para tarefas críticas).
#
# webhook:
#   url: https://hooks.slack.com/services/...   # ou URL de webhook Discord
#   timeout_seconds: 10

jobs:
  - id: exemplo_segundos
    name: exemplo_tick
    interval:
      seconds: 5
    retry:
      attempts: 3
      wait_multiplier_seconds: 1
      wait_min_seconds: 1
      wait_max_seconds: 30

  - id: exemplo_minutos
    name: exemplo_relatorio
    interval:
      minutes: 1

  - id: exemplo_horas
    name: exemplo_manutencao
    interval:
      hours: 1
